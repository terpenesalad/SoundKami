name: Build & release

# Builds the Windows installer + portable zip on every push to main.
# If package.json has a version that hasn't been released yet, it also creates
# the v<version> tag and a GitHub release with both files attached.
# Pushing a v* tag yourself works too.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Work out the version
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released — building only."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Will publish v$version."
          fi

      - run: npm ci

      # Build the app-audio capture helper with the same MinGW toolchain used locally.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Build sk-capture.exe
        shell: msys2 {0}
        run: g++ -O2 -std=c++17 -municode -static -s -o native/sk-capture.exe native/sk-capture.cpp -lole32 -lversion -luuid

      - name: Package portable build
        run: node scripts/package.js

      - name: Build installer
        run: npx electron-builder --win nsis --x64 --prepackaged dist/SoundKami-win32-x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: SoundKami-${{ steps.v.outputs.version }}-windows
          path: |
            dist/installer/*.exe
            dist/*.zip

      - name: Publish GitHub release
        if: steps.v.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SoundKami ${{ steps.v.outputs.version }}
          body: |
            ## Install
            Download **SoundKami-Setup-${{ steps.v.outputs.version }}.exe** and run it. Prefer no install? Use the portable zip.

            Windows may show a SmartScreen warning because the app isn't code-signed yet: click **More info → Run anyway**.

            ## First-time setup
            1. Install the free [VB-CABLE](https://vb-audio.com/Cable/) driver and restart.
            2. Open SoundKami — the setup guide picks your mic, the cable and your headphones.
            3. In Discord → Voice & Video, set **Input Device** to **CABLE Output**, and turn off Noise Suppression and Echo Cancellation.

            See the README for features and troubleshooting.
          files: |
            dist/installer/*.exe
            dist/*.zip
          generate_release_notes: true
