<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; font-src 'self'">
  <title>SoundKami</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="titlebar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 3h10l4 4v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" fill="var(--accent)"/>
          <path d="M15 3v4h4" fill="var(--accent-fold)"/>
          <rect x="6.5" y="11" width="2" height="5" rx="1" fill="var(--on-accent)"/>
          <rect x="10" y="8.5" width="2" height="10" rx="1" fill="var(--on-accent)"/>
          <rect x="13.5" y="12" width="2" height="3.5" rx="1" fill="var(--on-accent)"/>
        </svg>
        <span>SoundKami</span>
      </div>
      <label class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.3 3.3"/></svg>
        <input id="search" type="search" placeholder="Search all sounds" autocomplete="off" spellcheck="false">
        <kbd class="search-hint">Ctrl F</kbd>
      </label>
      <div class="titlebar-actions">
        <button class="icon-btn" id="btn-settings" title="Settings (Ctrl+,)" aria-label="Settings">
          <svg viewBox="0 0 20 20"><path d="M10 12.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2Z"/><path d="M16.2 11.7a1.3 1.3 0 0 0 .26 1.43l.05.05a1.58 1.58 0 1 1-2.23 2.23l-.05-.05a1.3 1.3 0 0 0-1.43-.26 1.3 1.3 0 0 0-.79 1.19v.14a1.58 1.58 0 1 1-3.15 0v-.07a1.3 1.3 0 0 0-.85-1.19 1.3 1.3 0 0 0-1.43.26l-.05.05a1.58 1.58 0 1 1-2.23-2.23l.05-.05a1.3 1.3 0 0 0 .26-1.43 1.3 1.3 0 0 0-1.19-.79h-.14a1.58 1.58 0 1 1 0-3.15h.07a1.3 1.3 0 0 0 1.19-.85 1.3 1.3 0 0 0-.26-1.43l-.05-.05a1.58 1.58 0 1 1 2.23-2.23l.05.05a1.3 1.3 0 0 0 1.43.26h.06a1.3 1.3 0 0 0 .79-1.19v-.14a1.58 1.58 0 1 1 3.15 0v.07a1.3 1.3 0 0 0 .79 1.19 1.3 1.3 0 0 0 1.43-.26l.05-.05a1.58 1.58 0 1 1 2.23 2.23l-.05.05a1.3 1.3 0 0 0-.26 1.43v.06a1.3 1.3 0 0 0 1.19.79h.14a1.58 1.58 0 1 1 0 3.15h-.07a1.3 1.3 0 0 0-1.19.79Z"/></svg>
        </button>
      </div>
    </header>

    <aside class="sidebar">
      <div class="side-section">
        <div class="side-head">
          <h2>Boards</h2>
          <button class="icon-btn sm" id="btn-new-board" title="New board" aria-label="New board">
            <svg viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11"/></svg>
          </button>
        </div>
        <nav id="boards" class="boards"></nav>
      </div>

      <div class="side-section share">
        <div class="side-head">
          <h2>Shared audio</h2>
          <button class="icon-btn sm" id="btn-share" title="Choose apps to share" aria-label="Choose apps to share">
            <svg viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11"/></svg>
          </button>
        </div>
        <div id="share-list" class="share-list"></div>
      </div>
    </aside>

    <main class="main" id="main">
      <div class="board-head">
        <div class="board-title">
          <button class="board-emoji" id="board-emoji" title="Change icon"></button>
          <h1 id="board-name" title="Click to rename"></h1>
          <span class="board-count" id="board-count"></span>
        </div>
        <div class="board-actions">
          <button class="btn primary" id="btn-add">
            <svg viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11"/></svg>
            Add sounds
          </button>
          <button class="icon-btn" id="btn-board-menu" title="More" aria-label="More board actions">
            <svg viewBox="0 0 20 20"><circle cx="5" cy="10" r="1.3"/><circle cx="10" cy="10" r="1.3"/><circle cx="15" cy="10" r="1.3"/></svg>
          </button>
        </div>
      </div>
      <div class="grid-wrap" id="grid-wrap">
        <div class="grid" id="grid"></div>
      </div>
      <div class="drop-veil" id="drop-veil"><div>Drop to add to <strong id="drop-board"></strong></div></div>
    </main>

    <footer class="mixer" id="mixer"></footer>

    <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  </div>

  <div id="layer"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
